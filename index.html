<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pendaftaran Volunteer UPN Mengajar</title>
</head>
<body>

    <h2>Pendaftaran Volunteer</h2>
    <h3>Program Kerja UPN Mengajar</h3>
    <h4>UKM Penalaran dan Kreativitas</h4>

    <form id="formVolunteer">

        <fieldset>
            <legend>Data Diri</legend>

            <p>
                <label>Nama Lengkap :</label><br>
                <input type="text" id="nama" required>
            </p>

            <p>
                <label>NIM :</label><br>
                <input type="text" id="nim" required pattern="[0-9]{10,15}">
            </p>

            <p>
                <label>Program Studi :</label><br>
                <input type="text" id="prodi" required>
            </p>

            <p>
                <label>Fakultas :</label><br>
                <input type="text" id="fakultas" required>
            </p>

            <p>
                <label>Semester :</label><br>
                <input type="number" id="semester" min="1" max="14" required>
            </p>

            <p>
                <label>Email :</label><br>
                <input type="email" id="email" required>
            </p>

            <p>
                <label>No. HP / WhatsApp :</label><br>
                <input type="text" id="nohp" required pattern="[0-9]{10,15}">
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Informasi Tambahan</legend>

            <p>
                <label>Pengalaman Mengajar / Organisasi :</label><br>
                <textarea id="pengalaman" rows="4" cols="50" required></textarea>
            </p>

            <p>
                <label>Alasan Mendaftar Volunteer :</label><br>
                <textarea id="alasan" rows="4" cols="50" required></textarea>
            </p>

            <p>
                <label>Divisi yang Dipilih :</label><br>
                <select id="divisi" required>
                    <option value="">-- Pilih Divisi 1 --</option>
                    <option>Pengajar</option>
                    <option>Acara</option>
                    <option>Humas</option>
                    <option>Pdd</option>
                    <option>Konsumsi</option>
                    <option>Perlengkapan</option>
                    <option>Keamanan</option>
                </select>
                <select id="divisi" required>
                    <option value="">-- Pilih Divisi 2 --</option>
                    <option>Pengajar</option>
                    <option>Acara</option>
                    <option>Humas</option>
                    <option>Pdd</option>
                    <option>Konsumsi</option>
                    <option>Perlengkapan</option>
                    <option>Keamanan</option>
                </select>
            </p>

            <p>
                <label>Bersedia mengikuti seluruh rangkaian kegiatan?</label><br>
                <input type="radio" name="komitmen" value="Ya" required> Ya
                <input type="radio" name="komitmen" value="Tidak"> Tidak
            </p>

        </fieldset>

        <br>

        <button type="submit">Daftar Sekarang</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
